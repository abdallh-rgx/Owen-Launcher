[package]
name = "owen-redirecter"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "libOwen.so — the Owen redirecter: auto-detected curl hooks + ART WebView/Kairos hooks, zero smali"

[lib]
name = "owen"
crate-type = ["cdylib", "rlib"]

[dependencies]
owen-core = { path = "../owen-core" }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
libc = "0.2"
