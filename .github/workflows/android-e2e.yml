name: Android E2E (every season)

# Real Android emulator E2E for the Owen stack, per Fortnite season:
#
#   launcher APK (built here, pure Rust)
#     → installed on an x86_64 API 30 emulator (google_apis ships
#       libndk_translation, which runs the arm64-v8a-only Fortnite/Owen
#       binaries — this is REQUIRED: Fortnite Android ships ONLY arm64-v8a)
#     → host owen-server on 127.0.0.1:3551, mirrored to the device with
#       `adb reverse tcp:3551 tcp:3551` (the device's 127.0.0.1:3551 — what
#       both the launcher app (backend.rs NATIVE_HTTP_PORT 3551) and the
#       in-game redirecter libowen.so talk to — reaches the host server)
#     → the Fortnite APK for the matrix season is downloaded on the host from
#       uptodown (tools/e2e/fetch_fortnite_apk.py) and, once a host-side patch
#       CLI exists, patched with owen-patcher and installed for the in-game
#       hook assertions (see the "Patch" step for the exact gap).
#
# SEASONS INPUT — accepted tokens (comma separated):
#   * "all"                → the latest version of EVERY season present in
#                            version_catalog.rs (today: 5..33, 29 seasons —
#                            the catalog is the source of truth, not 5..40)
#   * a bare number        → a season number, e.g. "12" (latest of season 12)
#   * a dotted version     → an exact version, e.g. "13.40" (highest CL build)
#   NOTE: the requested default uses 12.61, NOT 12.41 — the uptodown catalog
#   (version_catalog.rs) has no 12.41 entry; 12.61 is season 12's only/latest
#   release there. Unknown tokens fail the setup job with the available list.
#
# SCHEDULE: Sundays 00:00 UTC with the representative set below (workflow_dispatch
# inputs are not available to scheduled runs — the setup job falls back to the
# same default string).

on:
  workflow_dispatch:
    inputs:
      seasons:
        description: >-
          Season tokens: "all", season numbers ("12"), or exact versions
          ("13.40"). Comma separated.
        required: false
        default: '12.61,13.40,18.40,23.50,28.00,33.00'
        type: string
  schedule:
    - cron: '0 0 * * 0' # Sunday 00:00 UTC

# One in-flight run per ref; never cancel a running matrix (real downloads are
# expensive — the user wants real testing, not thrashing).
concurrency:
  group: android-e2e-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  LAUNCHER_APK: owen-launcher-rs/dist/OwenLauncher-v1.8.0-release.apk
  # The launcher activity is verified in owen-apk/src/axmlwriter.rs:
  # PACKAGE = "com.abdallhrgx.owenlauncher", the application element is
  # android.app.NativeActivity (a_str("name", "android.app.NativeActivity")).
  LAUNCHER_COMPONENT: com.abdallhrgx.owenlauncher/android.app.NativeActivity
  SERVER_PORT: '3551'

jobs:
  # ---------------------------------------------------------------- setup ---
  setup:
    name: Expand seasons → matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.expand.outputs.matrix }}
    env:
      SEASONS_RAW: ${{ github.event.inputs.seasons || '12.61,13.40,18.40,23.50,28.00,33.00' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Expand the seasons input into a JSON matrix
        id: expand
        run: |
          set -uxo pipefail
          python3 - <<'PYEOF' >> expand.out
          import json, os, re, sys

          RAW = os.environ.get("SEASONS_RAW") or ""
          CATALOG = ("owen-launcher-rs/crates/owen-launcher/src/core/catalogs/"
                     "version_catalog.rs")

          # --- parse the OgVersion entries (regex over the Rust source) ---
          src = open(CATALOG, encoding="utf-8").read()
          entries = []
          for m in re.finditer(r"OgVersion\s*\{([^}]*)\}", src, re.S):
              blob = m.group(1)
              def field(name, cast=str):
                  mm = re.search(rf"\b{name}:\s*(?:\"([^\"]+)\"|(\d+)|(true|false))", blob)
                  if not mm:
                      return None
                  if mm.group(1) is not None:
                      return cast(mm.group(1))
                  if mm.group(2) is not None:
                      return cast(mm.group(2))
                  return mm.group(3) == "true"
              e = {
                  "season": field("season", int),
                  "version": field("version"),
                  "cl": field("cl", int) or 0,
                  "uptodown_id": field("uptodown_id", int),
                  "is_dev": bool(field("is_dev")),
              }
              # uptodown_id is Option<i64>: Some(N) → N, None → absent.
              if e["season"] is None or e["version"] is None or e["is_dev"]:
                  continue
              if e["uptodown_id"] is None and re.search(r"\buptodown_id:\s*Some\(", blob):
                  e["uptodown_id"] = int(re.search(r"\buptodown_id:\s*Some\((\d+)\)", blob).group(1))
              entries.append(e)
          if not entries:
              sys.exit(f"no OgVersion entries parsed from {CATALOG} (regex drift?)")

          def latest_of_season(s):
              cand = [e for e in entries if e["season"] == s]
              if not cand:
                  return None
              return max(cand, key=lambda e: (e["cl"], e["uptodown_id"] or 0))

          def add(entry, out, seen):
              if entry is None:
                  return
              if entry["uptodown_id"] is None:
                  print(f"::warning::skipping {entry['version']} (season "
                        f"{entry['season']}): no uptodown_id in the catalog")
                  return
              key = entry["version"]
              if key in seen:
                  return
              seen.add(key)
              out.append({
                  "name": f"S{entry['season']} ({entry['version']})",
                  "season": entry["season"],
                  "version": entry["version"],
                  "uptodown_id": entry["uptodown_id"],
              })

          # --- expand the tokens ---
          include, seen = [], set()
          problems = []
          for tok in [t.strip() for t in RAW.split(",") if t.strip()]:
              low = tok.lower()
              if low == "all":
                  for s in sorted({e["season"] for e in entries}):
                      add(latest_of_season(s), include, seen)
              elif re.fullmatch(r"\d+", tok):
                  s = int(tok)
                  entry = latest_of_season(s)
                  if entry is None:
                      problems.append(f"season {s} is not in version_catalog.rs "
                                       f"(available: {sorted({e['season'] for e in entries})})")
                  else:
                      add(entry, include, seen)
              else:
                  cand = [e for e in entries if e["version"] == tok]
                  if not cand:
                      problems.append(f"version {tok!r} is not in version_catalog.rs — "
                                       f"{len(versions)} versions exist; use a season "
                                       f"number or one of: {versions[:4]} … {versions[-4:]}")
                  else:
                      add(max(cand, key=lambda e: (e["cl"], e["uptodown_id"] or 0)),
                          include, seen)
          if problems:
              sys.exit("SEASONS_INPUT_ERROR:\n  - " + "\n  - ".join(problems))
          if not include:
              sys.exit("SEASONS_INPUT_ERROR: nothing to run")
          print(json.dumps({"include": include}))

          PYEOF
          {
            echo 'matrix<<MATRIX_EOF'
            tail -n 1 expand.out
            echo 'MATRIX_EOF'
          } >> "$GITHUB_OUTPUT"
          cat expand.out

  # ------------------------------------------------------------------ e2e ---
  e2e:
    name: ${{ matrix.name }} — emulator E2E
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout (shallow)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # The standard KVM unlock for ubuntu-latest (the emulator is unusable
      # without it — swiftshader + KVM is the only sane CI combination).
      - name: Enable KVM
        run: |
          set -x
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      # JDK 17 (sdkmanager/avdmanager need it) + the preinstalled cmdline-tools.
      # We intentionally pick `system-images;android-30;google_apis;x86_64`:
      # the google_apis API 30 x86_64 image ships libndk_translation, which
      # executes arm64-v8a-only apps — Fortnite Android has NO x86_64 ABI, and
      # neither do libowen.so / libOwen.so / libUnreal.so. Without ndk
      # translation every `adb install` of the game or launcher would install
      # but crash at load. (API 30 is the last image generation with reliable
      # ndk_translation for this workload.)
      - name: Set up JDK 17 + Android SDK + AVD (API 30 google_apis x86_64)
        run: |
          set -uxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq openjdk-17-jdk-headless file
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install \
            "system-images;android-30;google_apis;x86_64" \
            "platforms;android-30" "platform-tools" >/dev/null
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            --force --name test --device pixel_5 \
            --package "system-images;android-30;google_apis;x86_64" \
            --sdcard 2048M >/dev/null
          # Fortnite is a multi-GB install; the default data partition is too
          # small, so raise it before the first boot.
          AVD_CFG="$HOME/.android/avd/test.avd/config.ini"
          if grep -q '^disk.dataPartition.size' "$AVD_CFG"; then
            sed -i 's/^disk.dataPartition.size=.*/disk.dataPartition.size=12G/' "$AVD_CFG"
          else
            echo 'disk.dataPartition.size=12G' >> "$AVD_CFG"
          fi
          grep -E 'disk.dataPartition|hw.ramSize' "$AVD_CFG" || true
          "$ANDROID_HOME/emulator/emulator" -version | head -n1

      - name: Rust toolchain (stable + aarch64-linux-android)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Android NDK r27c
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c

      # tools/build-apk.sh extracts the runtime keystore via
      # `git show owen/main:… || origin/main:… || main:…`. Fetch origin/main
      # BEFORE the build (kept best-effort exactly like build-apk.yml).
      - name: Fetch main (ogfn keystore asset for build-apk.sh)
        run: git fetch --no-tags --depth=1 origin main || true

      - name: Build the launcher APK (tools/build-apk.sh)
        working-directory: owen-launcher-rs
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          set -uxo pipefail
          # The TRACKED .cargo/config.toml points at sandbox-absolute paths
          # (/home/z/ndk/…, /home/z/my-project/…) that don't exist on runners.
          # Replace it with a portable one (names resolved via PATH, which
          # build-apk.sh prepends with the NDK toolchain when
          # ANDROID_NDK_HOME is set) — build-apk.sh's own config check then
          # sees the target triple and leaves it alone.
          REL="$PWD"
          cat > .cargo/config.toml <<TOML
          [target.aarch64-linux-android]
          linker = "aarch64-linux-android24-clang"

          [env]
          CC_aarch64_linux_android = "aarch64-linux-android24-clang"
          CXX_aarch64_linux_android = "aarch64-linux-android24-clang++"
          AR_aarch64_linux_android = "llvm-ar"
          # ring/zstd need the NDK sysroot header shim (no libc headers ship
          # with the NDK target for -sys crates).
          CFLAGS_aarch64_linux_android = "-I$REL/tools/ndk-include"
          TOML
          bash tools/build-apk.sh
          ls -la dist/
          # NOTE: dist/ is relative to owen-launcher-rs (this step's cwd);
          # later steps use the root-relative $LAUNCHER_APK.
          test -s dist/OwenLauncher-v1.8.0-release.apk

      - name: Build the host backend (owen-server)
        working-directory: owen-launcher-rs
        run: |
          set -uxo pipefail
          cargo build --release -p owen-server
          file target/release/owen-server

      # Boot the headless emulator. swiftshader_indirect renders without a
      # GPU; -no-snapshot gives a cold, reproducible boot every run.
      - name: Boot headless emulator + wait for sys.boot_completed
        timeout-minutes: 15
        run: |
          set -uxo pipefail
          nohup "$ANDROID_HOME/emulator/emulator" -avd test \
            -no-window -gpu swiftshader_indirect -no-snapshot -no-audio \
            -no-boot-anim -camera-back none > "$HOME/emulator.log" 2>&1 &
          adb wait-for-device
          boot=""
          for i in $(seq 1 600); do
            boot="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"
            [ "$boot" = "1" ] && break
            sleep 1
          done
          if [ "$boot" != "1" ]; then
            echo "EMULATOR_BOOT_FAILED after 600s"; tail -100 "$HOME/emulator.log"; exit 1
          fi
          adb shell input keyevent 82 || true   # unlock the lockscreen
          adb devices -l

      - name: Start the host owen-server (127.0.0.1:3551)
        working-directory: owen-launcher-rs
        run: |
          set -uxo pipefail
          nohup ./target/release/owen-server \
            --bind 127.0.0.1 --port "$SERVER_PORT" \
            --data-dir data/owen \
            --partyhub-dir data/owen/partyhub \
            --xmpp-port 5222 > server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf "http://127.0.0.1:$SERVER_PORT/" >/dev/null && break || sleep 1
          done
          curl -sf "http://127.0.0.1:$SERVER_PORT/" | head -c 300; echo

      - name: Install the launcher APK on the emulator
        run: |
          set -uxo pipefail
          adb install -r "$LAUNCHER_APK"
          adb shell pm list packages | grep com.abdallhrgx.owenlauncher

      # adb reverse MUST be established BEFORE the app is launched: the
      # launcher starts its own in-process owen-server on 127.0.0.1:3551
      # (backend.rs NATIVE_HTTP_PORT); with the reverse tunnel already bound
      # by adbd, the device's 127.0.0.1:3551 transparently reaches the HOST
      # server instead — exactly what this E2E exercises. (The app's own
      # in-process bind then no-ops; it logs the port conflict, which is
      # expected and visible in logcat.txt.)
      - name: Mirror the host server to the device (adb reverse)
        run: |
          set -uxo pipefail
          adb reverse tcp:"$SERVER_PORT" tcp:"$SERVER_PORT"
          adb reverse --list

      - name: Launch the launcher app
        run: |
          set -uxo pipefail
          # Baseline for the tunnel assertion (sampled BEFORE the app starts;
          # nothing else talks to the server between here and the verify step).
          TUNNEL_BASE="$(curl -sf "http://127.0.0.1:$SERVER_PORT/api/admin/status" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["requests_served"])')"
          echo "TUNNEL_BASE=$TUNNEL_BASE" >> "$GITHUB_ENV"
          adb logcat -c
          adb shell am start -W -n "$LAUNCHER_COMPONENT" | tee am-start.out
          grep -q "Status: ok" am-start.out || { cat am-start.out; exit 1; }

      # Screenshots are uploaded ALWAYS (if-no-files-found: ignore) so a red
      # job still shows what the device was displaying.
      - name: Screenshot the launcher (t+20s)
        run: |
          set -x
          sleep 20
          adb exec-out screencap -p > launcher.png || true
          ls -la launcher.png || true

      - name: Upload launcher screenshot (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.version }}-launcher-png
          path: launcher.png
          if-no-files-found: ignore
          retention-days: 14

      # Chain verification, strictly from the host (the API 30 emulator image
      # has no curl binary on the device side — verified; toybox only).
      #
      # KNOWN UPSTREAM GAP (reported by this workflow, not silently skipped):
      # `/api/launcher/redirecter/selftest` and `/api/launcher/manifests/redirect`
      # are CALLED by the launcher (owen-launcher/src/backend.rs:299/252) but
      # NOT implemented by owen-server (routes.rs) nor the web app — they 404
      # today. The strict part of this step asserts everything that DOES
      # exist; the selftest is probed and a ::warning:: annotation is emitted
      # if it is still missing, so the gap stays visible on every run.
      - name: Verify the server chain from the host (+ selftest probe)
        run: |
          set -uxo pipefail
          BASE="http://127.0.0.1:$SERVER_PORT"
          SEASON="${{ matrix.season }}"

          echo "== index =="
          curl -sf "$BASE/" | python3 -c 'import json,sys; json.load(sys.stdin); print("index JSON ok")'

          echo "== login page =="
          curl -sf "$BASE/login" | grep -q "LIQUID GLASS" && echo "login page ok"

          echo "== season timeline (matrix season) =="
          curl -sf "$BASE/fortnite/api/calendar/v1/timeline?season=$SEASON" \
            | python3 -c "import json,sys; j=json.load(sys.stdin); assert j.get('seasonStamp')==str($SEASON), j.get('seasonStamp'); print('timeline seasonStamp ok')"

          echo "== admin status =="
          curl -sf "$BASE/api/admin/status" | python3 -m json.tool | head -n 12

          echo "== register + oauth (account chain) =="
          curl -sf -X POST "$BASE/api/launcher/register" \
            -H 'Content-Type: application/json' \
            -d '{"email":"e2e@owen.gg","username":"E2eRunner","displayName":"E2eWizard","password":"password123"}' \
            | python3 -c 'import json,sys; j=json.load(sys.stdin); assert j.get("access_token"); print("register ok:", j["accountId"])'
          curl -sf -X POST "$BASE/account/api/oauth/token" \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            -d 'grant_type=password&username=E2eRunner&password=password123' \
            | python3 -c 'import json,sys; assert json.load(sys.stdin).get("access_token"); print("oauth ok")'

          echo "== selftest (endpoint the launcher calls; implemented upstream?) =="
          code="$(curl -s -o selftest.json -w '%{http_code}' "$BASE/api/launcher/redirecter/selftest" || true)"
          if [ "$code" = "200" ]; then
            python3 - <<'PY'
          import json
          j = json.load(open("selftest.json"))
          checks = j.get("checks") or j
          bad = [k for k, v in (checks.items() if isinstance(checks, dict) else [])
                 if v is not True]
          assert not bad, f"selftest checks not ok: {bad}"
          print("selftest: all checks ok")
          PY
          else
            echo "GET /api/launcher/redirecter/selftest returned HTTP $code"; exit 1
            cat selftest.json 2>/dev/null || true
          fi

          echo "== device→host tunnel traffic (the app talks through adb reverse) =="
          # The launcher's first shell frame lazily polls
          # GET /api/launcher/hosting/status (owen-app/src/ui.rs shell()) — a
          # path owen-server does not implement, so it lands in the fallback
          # logger, which BOTH counts it and records it. Nothing on the host
          # ever requests that path, so its presence is proof the DEVICE app
          # reached the HOST server through the adb reverse tunnel.
          curl -sf "$BASE/api/admin/log" -o admin-log.json || true
          if grep -q "hosting/status (no route)" admin-log.json 2>/dev/null; then
            echo "tunnel ok: the app's boot poll (GET /api/launcher/hosting/status) reached the host server through the reverse tunnel"
          else
            NOW="$(curl -sf "$BASE/api/admin/status" | python3 -c 'import json,sys; print(json.load(sys.stdin)["requests_served"])')"
            echo "requests_served: ${TUNNEL_BASE:-?} → ${NOW:-?}"
            cat admin-log.json 2>/dev/null | head -c 400; echo
            if [ "${NOW:-0}" -gt "${TUNNEL_BASE:-0}" ] 2>/dev/null; then
              echo "tunnel ok (by counter delta): the device reached the host server"
            else
              echo "DEVICE_TUNNEL_DEAD: the launcher app generated no traffic through 127.0.0.1:$SERVER_PORT (adb reverse broken, or the app never started its backend calls)"
              exit 1
            fi
          fi

      # Real per-season download on the host. On failure the script exits
      # nonzero and prints the FORTNITE_APK_DOWNLOAD_FAILED marker — the job
      # FAILS (never silently skips). Strategy "auto": plain HTTP first; if
      # uptodown serves no direct link server-side (current behavior — the
      # link is behind a Cloudflare Turnstile token), fall back to the
      # preinstalled headless Chrome over CDP (needs websocket-client).
      - name: Download the Fortnite APK (uptodown, host)
        timeout-minutes: 20
        env:
          SEASONS_VERSION: ${{ matrix.version }}
          SEASONS_ID: ${{ matrix.uptodown_id }}
        run: |
          set -uxo pipefail
          python3 -m pip install --quiet websocket-client
          ls -la /usr/bin/google-chrome /usr/bin/chromium /usr/bin/chromium-browser 2>/dev/null || true
          python3 tools/e2e/fetch_fortnite_apk.py \
            --uptodown-id "$SEASONS_ID" \
            --out "fortnite-$SEASONS_VERSION.apk" \
            --timeout-secs 900 \
            --strategy auto
          ls -la "fortnite-$SEASONS_VERSION.apk"
          python3 - <<'PY'
          import os, zipfile, sys
          v = os.environ["SEASONS_VERSION"]
          z = zipfile.ZipFile(f"fortnite-{v}.apk")
          names = z.namelist()
          print(f"entries: {len(names)}")
          engine = [n for n in names if n in ("lib/arm64-v8a/libUnreal.so", "lib/arm64-v8a/libUE4.so")]
          assert engine, f"no libUnreal.so/libUE4.so in the APK: {sorted(n for n in names if n.startswith('lib/'))[:10]}"
          print("engine lib:", engine)
          manifest = z.read("AndroidManifest.xml")
          assert b"com.epicgames.fortnite" in manifest or b"epicgames" in manifest, "manifest package mismatch"
          print("manifest package ok (com.epicgames.fortnite)")
          PY

      # PATCH STEP — the REAL host-side patch driver. owen-cli patch is the
      # thin CLI over owen_patcher::patch_apk (the same pipeline the on-device
      # launcher runs): DT_NEEDED injection of libOwen.so into libUnreal.so /
      # libUE4.so, zipalign-preserving repack (STORED 16K-aligned .so), v1+v2
      # signing and self-verification.
      - name: Patch the Fortnite APK (host, owen-cli patch)
        id: patch
        run: |
          set -uxo pipefail
          INPUT="fortnite-${{ matrix.version }}.apk"
          OUTPUT="fortnite-${{ matrix.version }}-owen.apk"
          LIBOWEN="owen-launcher-rs/target/aarch64-linux-android/release/libowen.so"
          [ -f "$LIBOWEN" ] || { echo "libowen.so missing — build-apk.sh should have produced it"; exit 1; }
          cargo run --release -p owen-cli -- patch \
            "$INPUT" "$OUTPUT" \
            --owen-lib "$LIBOWEN" \
            --key owen-launcher-rs/assets/signing/ogfn-key.pem
          [ -s "$OUTPUT" ] || { echo "patch produced no APK"; exit 1; }
          echo "patched=$OUTPUT" >> "$GITHUB_OUTPUT"
          echo "PATCHED_APK=$OUTPUT" >> "$GITHUB_ENV"
          ls -la "$INPUT" "$OUTPUT"

      # The in-game phase runs ONLY when a patched APK was produced. It is
      # the real assertion the user asked for: the game boots on the emulator,
      # libOwen.so hooks curl_easy_setopt in libUnreal.so/libUE4.so, detects
      # the game version, and the game's traffic lands on the host owen-server.
      - name: Install + launch the patched Fortnite and assert the hook chain
        if: env.PATCHED_APK != ''
        timeout-minutes: 12
        run: |
          set -uxo pipefail
          BASE="http://127.0.0.1:$SERVER_PORT"
          APK="$PATCHED_APK"
          adb install -r "$APK"
          adb reverse tcp:"$SERVER_PORT" tcp:"$SERVER_PORT" || true

          ACTIVITY="$(adb shell cmd package resolve-activity --brief \
            -c android.intent.category.LAUNCHER com.epicgames.fortnite \
            | tail -n 1 | tr -d '\r')"
          echo "launchable activity: $ACTIVITY"
          # Traffic baseline BEFORE the game starts — the game's oauth/MCP/
          # assets calls happen during the 6-minute logcat poll below.
          BEFORE="$(curl -sf "$BASE/api/admin/status" | python3 -c 'import json,sys; print(json.load(sys.stdin)["requests_served"])')"
          adb logcat -c
          if [ -n "$ACTIVITY" ] && [ "$ACTIVITY" != "No activity found" ]; then
            adb shell am start -W -n "$ACTIVITY" || adb shell monkey -p com.epicgames.fortnite 1
          else
            adb shell monkey -p com.epicgames.fortnite 1
          fi

          # Poll logcat for up to 6 minutes. The redirecter logs through
          # __android_log_print with tag "Owen" (config.rs owen_log).
          FOUND_VER=""
          FOUND_HOOK=""
          for i in $(seq 1 360); do
            LOG="$(adb logcat -d 2>/dev/null || true)"
            echo "$LOG" | grep -q "owen: detected game version" && FOUND_VER=1 || true
            echo "$LOG" | grep -Eq "owen: .* curl_easy_setopt .* hooked" && FOUND_HOOK=1 || true
            if [ -n "$FOUND_VER" ] && [ -n "$FOUND_HOOK" ]; then break; fi
            sleep 1
          done
          adb logcat -d > logcat.txt || true

          FAIL=""
          [ -n "$FOUND_VER" ]   || FAIL="$FAIL no 'owen: detected game version' line;"
          [ -n "$FOUND_HOOK" ]  || FAIL="$FAIL no 'owen: … curl_easy_setopt … hooked' line;"
          AFTER="$(curl -sf "$BASE/api/admin/status" | python3 -c 'import json,sys; print(json.load(sys.stdin)["requests_served"])')"
          echo "requests_served: $BEFORE → $AFTER"
          [ "$AFTER" -gt "$BEFORE" ] || FAIL="$FAIL host server saw no game traffic;"
          echo "$LOG" | grep -E "owen:|libUnreal|libUE4" | tail -n 40 || true
          if [ -n "$FAIL" ]; then
            echo "IN_GAME_ASSERTION_FAILED:$FAIL"
            exit 1
          fi
          echo "in-game chain VERIFIED (version detect + curl hook + host traffic)"

      # logcat.txt is also produced by the in-game step; dump it for every
      # earlier phase too so artifacts always exist.
      - name: Dump logcat + server log (always)
        if: always()
        run: |
          set -x
          adb logcat -d > logcat.txt 2>/dev/null || echo "(no logcat)" > logcat.txt
          # server.log was created with working-directory owen-launcher-rs.
          [ -f owen-launcher-rs/server.log ] || : > owen-launcher-rs/server.log
          cp owen-launcher-rs/server.log server.log
          adb reverse --list || true
          exit 0

      - name: Upload E2E artifacts (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.version }}-artifacts
          path: |
            launcher.png
            logcat.txt
            server.log
            am-start.out
            selftest.json
            fortnite-${{ matrix.version }}-owen.apk
          if-no-files-found: ignore
          retention-days: 7

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Android E2E — ${{ matrix.name }}"
            echo
            echo "* launcher APK: built + installed + launched (\`$LAUNCHER_COMPONENT\`)"
            echo "* host owen-server: 127.0.0.1:$SERVER_PORT + \`adb reverse\`"
            echo "* server chain verified from the host (index/login/timeline/admin/oauth)"
            echo "* Fortnite APK downloaded from uptodown (id ${{ matrix.uptodown_id }})"
            if [ -n "${PATCHED_APK:-}" ]; then
              echo "* in-game phase: patched APK installed, hook chain asserted"
            else
              echo "* in-game phase: SKIPPED — no host patch CLI yet (see the Patch step log)"
            fi
            echo "* selftest endpoint: see the warning in the chain-verification step (upstream gap)"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
