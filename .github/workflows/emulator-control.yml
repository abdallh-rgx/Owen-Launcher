name: Owen Emulator Control Room

# Human-in-the-loop emulator session (up to ~5.5h inside GitHub's 6h job cap).
#
# Boots a headless Android 11 (API 30) x86_64 emulator — that image ships
# ARM translation (libndk), which the aarch64-only OwenLauncher APK needs —
# installs the APK with `adb install -g` (grant ALL runtime permissions),
# launches it, then hands control to tools/control/driver.sh:
#
#   LIVE STREAM  → the site shows the phone screen ~1 fps; click it to
#                  annotate, watch the internal download, spot crashes.
#   SIGNALS      → you tell the driver when the internal download finished
#                  and when to start SDK generation (MobileDumper).
#   ASK LOOP     → screenshot task on the site → you click the button →
#                  the driver taps the emulator → repeat.
#
# The AVD is written BY HAND (config.ini + ini pointer) — no avdmanager:
# avdmanager silently failed on fresh runners ("Auto-selecting single ABI"
# then exit 0 with no AVD created → "touch: cannot touch .../config.ini").
# Writing the two files directly is deterministic and needs no Java prompts.

on:
  workflow_dispatch:
    inputs:
      control_url:
        description: "control_url — رابط غرفة التحكم (يُملأ تلقائياً عند الإطلاق من الموقع)"
        required: true
        default: ""
      control_token:
        description: "control_token — التوكن الظاهر في الموقع"
        required: false
        default: "owen-ctl-7f4k9qz2m8"
      apk_path:
        description: "مسار APK داخل المستودع"
        required: false
        default: "owen-launcher-rs/dist/OwenLauncher-v1.8.0-release.apk"
      dump_apk:
        description: "مسار MobileDumper APK (اختياري — لإشارة «ابدأ توليد SDK»)"
        required: false
        default: ""
      dump_pkg:
        description: "اسم حزمة MobileDumper (افتراضي = حزمة أوين)"
        required: false
        default: ""
      hours:
        description: "مدة الجلسة بالساعات (٢ حتى ٥٫٥)"
        required: false
        default: "5.5"
      api_level:
        description: "Android API level للمحاكي (٣٠ = يدعم ترجمة ARM)"
        required: false
        default: "30"

concurrency:
  group: control-room
  cancel-in-progress: true

permissions:
  contents: read

env:
  AVD_NAME: owen-control
  FORCE_COLOR: "1"

jobs:
  drive:
    name: Emulator + driver (up to 6h)
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17 (for sdkmanager)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Free disk space (Fortnite data needs room)
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/local/lib/android/caches /opt/hostedtoolcache/CodeQL \
                       /usr/share/dotnet /usr/local/lib/ryu /opt/ghc 2>/dev/null || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h / | tail -1

      - name: Check KVM
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "::error::/dev/kvm missing — this runner cannot hardware-accelerate the emulator."
            exit 1
          fi
          ls -l /dev/kvm

      - name: Install emulator + system image (API ${{ inputs.api_level }})
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "emulator" "platform-tools" \
            "system-images;android-${{ inputs.api_level }};google_apis;x86_64" \
            >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list_installed | grep -E "emulator|system-images" || true

      - name: Install Pillow (live-stream JPEG downscaler)
        run: |
          python3 -m pip install --user --quiet pillow || true
          python3 -c "from PIL import Image; print('Pillow OK')" || echo "Pillow missing — driver will stream PNG frames"

      - name: Create AVD by hand (Pixel 4, 12 GB data, no avdmanager)
        run: |
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME/$AVD_NAME.avd"

          cat > "$ANDROID_AVD_HOME/$AVD_NAME.ini" <<EOF
          avd.ini.encoding=UTF-8
          path=$ANDROID_AVD_HOME/$AVD_NAME.avd
          path.rel=avd/$AVD_NAME.avd
          target=android-${{ inputs.api_level }}
          EOF

          cat > "$ANDROID_AVD_HOME/$AVD_NAME.avd/config.ini" <<EOF
          avd.ini.encoding=UTF-8
          AvdId=$AVD_NAME
          PlayStore.enabled=false
          abi.type=x86_64
          avd.ini.displayname=$AVD_NAME
          disk.dataPartition.size=12280M
          fastboot.forceColdBoot=yes
          hw.accelerometer=yes
          hw.audioInput=no
          hw.battery=yes
          hw.camera.back=none
          hw.camera.front=none
          hw.cpu.arch=x86_64
          hw.cpu.ncore=3
          hw.device.name=pixel_4
          hw.gps=yes
          hw.gpu.enabled=yes
          hw.gpu.mode=swiftshader_indirect
          hw.keyboard=yes
          hw.lcd.density=440
          hw.lcd.height=2280
          hw.lcd.width=1080
          hw.mainKeys=no
          hw.ramSize=4096
          hw.sdCard=yes
          hw.sensors.orientation=yes
          hw.sensors.proximity=yes
          hw.trackBall=no
          image.sysdir.1=$ANDROID_HOME/system-images/android-${{ inputs.api_level }}/google_apis/x86_64/
          runtime.network.latency=none
          runtime.network.speed=full
          sdcard.size=2048M
          showDeviceFrame=no
          skin.dynamic=yes
          tag.display=Google APIs
          tag.id=google_apis
          vm.heapSize=512
          EOF

          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -x "$AVD_NAME" \
            || { echo "::error::AVD not listed after hand-write"; ls -la "$ANDROID_AVD_HOME"; exit 1; }
          echo "AVD $AVD_NAME ready:"
          cat "$ANDROID_AVD_HOME/$AVD_NAME.avd/config.ini" | head -5

      - name: Boot headless emulator
        run: |
          nohup "$ANDROID_HOME/emulator/emulator" -avd "$AVD_NAME" \
            -no-window -no-audio -no-boot-anim -no-snapshot -verbose \
            -gpu swiftshader_indirect -camera-back none -camera-front none \
            -memory 4096 -cores 3 \
            > /tmp/emulator.log 2>&1 &
          EMU_PID=$!
          echo "emulator launching…"
          
          sleep 5
          if ! kill -0 $EMU_PID 2>/dev/null; then
            echo "::error::Emulator process died immediately. Logs:"
            cat /tmp/emulator.log
            exit 1
          fi

          echo "Waiting for ADB to detect the emulator..."
          ADB_WAIT=0
          while ! "$ANDROID_HOME/platform-tools/adb" devices | grep -q "emulator-"; do
            sleep 5
            ADB_WAIT=$((ADB_WAIT+5))
            if ! kill -0 $EMU_PID 2>/dev/null; then
              echo "::error::Emulator died while waiting for ADB. Logs:"
              cat /tmp/emulator.log
              exit 1
            fi
            if [ $ADB_WAIT -ge 180 ]; then
              echo "::error::Emulator did not appear in ADB within 3 minutes. Logs:"
              cat /tmp/emulator.log
              exit 1
            fi
          done
          
          echo "Device detected in ADB. Waiting for boot completion..."
          for i in $(seq 1 144); do
            BOOT=$("$ANDROID_HOME/platform-tools/adb" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            [ "$BOOT" = "1" ] && { echo "BOOTED after ~$((i*5))s"; break; }
            sleep 5
            [ "$i" = "144" ] && { echo "::error::emulator did not boot in 12 min"; tail -50 /tmp/emulator.log; exit 1; }
          done
          "$ANDROID_HOME/platform-tools/adb" devices -l

      - name: Run Control Room driver v2 (live stream + signals ↔ your clicks)
        env:
          CONTROL_URL: ${{ inputs.control_url }}
          CONTROL_TOKEN: ${{ inputs.control_token || 'owen-ctl-7f4k9qz2m8' }}
          APK_PATH: ${{ inputs.apk_path || 'owen-launcher-rs/dist/OwenLauncher-v1.8.0-release.apk' }}
          DUMP_APK: ${{ inputs.dump_apk || '' }}
          DUMP_PKG: ${{ inputs.dump_pkg || '' }}
          SESSION_HOURS: ${{ inputs.hours || '5.5' }}
        run: |
          # hours → minutes, clamped to ≤ 325 (leave boot/teardown room)
          MINUTES=$(awk -v h="${SESSION_HOURS:-5.5}" 'BEGIN{m=h*60; if(m<10)m=10; if(m>325)m=325; printf "%d", m}')
          echo "driver session: $MINUTES minutes"
          export DRIVER_MAX_MINUTES="$MINUTES"
          bash owen-launcher-rs/tools/control/driver.sh

      - name: Upload session artifacts (screenshots + logs + SDK dumps)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owen-control-session
          path: |
            /tmp/owen-shots/
            /tmp/owen-driver.log
            /tmp/owen-logcat.txt
            /tmp/emulator.log
          if-no-files-found: warn
          retention-days: 7
