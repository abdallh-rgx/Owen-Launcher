<script>
  // 1. تفعيل أدوات الاعتراض فوراً قبل تحميل main.js
  window.__errors = [];
  
  const captureLog = (msg) => {
    window.__errors.push(msg);
    if (window.__debugBox) {
      const p = document.createElement('div');
      p.style.borderBottom = '1px solid #333';
      p.style.padding = '4px 0';
      p.innerText = msg;
      window.__debugBox.appendChild(p);
    }
  };

  window.onerror = function(message, source, lineno, colno, error) {
    captureLog('🚨 ERROR: ' + message + ' (Line: ' + lineno + ')');
  };

  window.addEventListener('unhandledrejection', function(event) {
    captureLog('⚠️ PROMISE REJECTION: ' + (event.reason ? (event.reason.message || JSON.stringify(event.reason)) : 'Unknown'));
  });

  const originalConsoleError = console.error;
  console.error = function(...args) {
    captureLog('❌ CONSOLE: ' + args.map(a => {
      try { return typeof a === 'object' ? JSON.stringify(a) : String(a); } 
      catch(e) { return 'Object'; }
    }).join(' '));
    originalConsoleError.apply(console, args);
  };

  const originalFetch = window.fetch;
  window.fetch = async function(...args) {
    try {
      const response = await originalFetch(...args);
      if (!response.ok) captureLog('🌐 NETWORK: ' + response.status + ' ' + response.url);
      return response;
    } catch (error) {
      captureLog('🌐 FETCH FAILED: ' + error.message + ' -> ' + args[0]);
      throw error;
    }
  };

  // 2. إنشاء الصندوق على الشاشة بمجرد توفر DOM
  document.addEventListener('DOMContentLoaded', () => {
    window.__debugBox = document.createElement('div');
    window.__debugBox.id = 'debug-box';
    window.__debugBox.style.cssText = 'position:fixed; top:0; left:0; right:0; max-height:50vh; background:rgba(0,0,0,0.95); color:#ff4444; z-index:999999; padding:10px; font-family:monospace; font-size:12px; overflow-y:auto; direction:ltr; text-align:left; border-bottom: 2px solid red;';
    document.body.appendChild(window.__debugBox);

    // طباعة الأخطاء التي تم التقاطها قبل إنشاء الصندوق
    if (window.__errors.length > 0) {
      window.__errors.forEach(err => {
        const p = document.createElement('div');
        p.style.borderBottom = '1px solid #333';
        p.style.padding = '4px 0';
        p.innerText = err;
        window.__debugBox.appendChild(p);
      });
    } else {
      window.__debugBox.innerText = '✅ لا توجد أخطاء جافاسكريبت حتى الآن. (المشكلة قد تكون في الشبكة أو في انتظار رد)';
    }
  });
