[OnlineSubsystemMcp.OnlineIdentityMcp]
RedirectUrl="{{BACKEND_URL}}"
AccountCreationUrl="/login"
LoginPortalUrl="/login"

[OnlineSubsystemMcp.OnlineIdentityMcp Prod]
RedirectUrl="{{BACKEND_URL}}"
AccountCreationUrl="/login"
LoginPortalUrl="/login"

# Owen note: the game's identity layer blindly prepends https:// to
# RedirectUrl, so an http:// backend surfaces as https://http://host:port.
# libowen.so peels the spurious prefix (owen_core::urlrule::normalize_scheme)
# so the protocol written here — http:// or https:// — is always honored.

# Do not remove/change, this redirects epicgames xmpp to owen server xmpp
[OnlineSubsystemMcp.Xmpp]
bUseSSL=false
ServerAddr="ws://127.0.0.1"
ServerPort=8080

# Do not remove/change, this redirects epicgames xmpp to owen server xmpp
[OnlineSubsystemMcp.OnlineIdentityMcp Prod Xmpp]
bUseSSL=false
ServerAddr="ws://127.0.0.1"
ServerPort=8080

# Do not remove/change, this redirects epicgames xmpp to owen server xmpp
[OnlineSubsystemMcp.Xmpp Prod]
bUseSSL=false
ServerAddr="ws://127.0.0.1"
ServerPort=8080

# Forces fortnite to use the v1 party system to support owen server xmpp
[OnlineSubsystemMcp]
bUsePartySystemV2=false

# Forces fortnite to use the v1 party system to support owen server xmpp
[OnlineSubsystemMcp.OnlinePartySystemMcpAdapter]
bUsePartySystemV2=false

# Fix for XMPP not working on some versions
[XMPP]
bEnableWebsockets=true

# Fix for long waiting at checking connections to datacenters on Switch & Mobile
[/Script/Qos.QosRegionManager]
NumTestsPerRegion=1
PingTimeout=0.1

[ConsoleVariables]
Fort.EnableHestiaBeauty=0
