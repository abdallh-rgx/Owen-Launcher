[package]
name = "owen-detect"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Universal curl_easy_setopt locator for stripped AArch64 ELF shared libraries (libUE4.so / libUnreal.so / libEOSSDK.so and any other ELF64-LE image). Safe Rust, zero dependencies."

[lib]
name = "owen_detect"
path = "src/lib.rs"

[[bin]]
name = "owen-detect"
path = "src/main.rs"
