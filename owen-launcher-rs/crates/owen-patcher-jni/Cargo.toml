[package]
name = "owen-patcher-jni"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "JNI surface for owen-patcher — the Android launcher calls patchApk() instead of the legacy Kotlin smali pipeline (libowenpatch.so)."

[lib]
name = "owenpatch"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
owen-patcher = { path = "../owen-patcher" }
jni = "0.21"
serde_json = "1"
