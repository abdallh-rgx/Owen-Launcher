<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Owen Server — Sign in</title>
<style>
  :root{--bg:#0b0d12;--card:rgba(255,255,255,.06);--line:rgba(255,255,255,.14);--fg:#eef1f6;--dim:#9aa3b2;--ok:#34d399;--err:#f87171}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{background:radial-gradient(1200px 600px at 20% -10%,#1d2740 0%,transparent 60%),radial-gradient(900px 500px at 110% 110%,#173a2e 0%,transparent 55%),var(--bg);color:var(--fg);font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px;backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5);box-shadow:0 24px 60px rgba(0,0,0,.45)}
  .logo{display:flex;align-items:center;gap:10px;margin-bottom:6px}
  .logo .dot{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#34d399,#0ea5e9);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;color:#04121a}
  h1{font-size:20px;font-weight:700;letter-spacing:.2px}
  .sub{color:var(--dim);font-size:13px;margin:4px 0 18px}
  label{display:block;font-size:12px;color:var(--dim);margin:12px 0 6px;text-transform:uppercase;letter-spacing:.8px}
  input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.25);color:var(--fg);font-size:15px;outline:none}
  input:focus{border-color:#34d399}
  button{width:100%;margin-top:18px;padding:13px;border:0;border-radius:12px;background:linear-gradient(135deg,#34d399,#0ea5e9);color:#04121a;font-size:16px;font-weight:800;cursor:pointer}
  button:active{filter:brightness(.9)}
  .status{margin-top:14px;font-size:13px;line-height:1.5;min-height:20px;color:var(--dim);word-break:break-all}
  .status.ok{color:var(--ok)} .status.err{color:var(--err)}
  .spin{display:inline-block;width:12px;height:12px;border:2px solid rgba(255,255,255,.25);border-top-color:#34d399;border-radius:50%;animation:r 1s linear infinite;vertical-align:-2px;margin-right:6px}
  @keyframes r{to{transform:rotate(360deg)}}
  .row{display:flex;gap:8px}.row input{flex:1}
  .done{font-size:26px;text-align:center;margin:6px 0 10px}
</style>
</head>
<body>
<div class="card">
  <div class="logo"><div class="dot">O</div><h1>Owen Server</h1></div>
  <div class="sub" id="sub">Fortnite 12.41 · offline sign-in</div>

  <div id="manual" style="display:none">
    <label for="name">Display name</label>
    <div class="row">
      <input id="name" value="OwenPlayer" autocomplete="off" autocapitalize="off" spellcheck="false">
    </div>
    <label for="pass">Password (optional)</label>
    <input id="pass" type="password" placeholder="leave empty for quick access">
    <button id="go">Sign in</button>
  </div>

  <div id="okcard" style="display:none">
    <div class="done">✅</div>
    <div class="sub" style="text-align:center">Signed in — returning to Fortnite…</div>
  </div>

  <div class="status" id="status"><span class="spin"></span>Connecting to Owen Server…</div>
</div>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var status = $("status");
  function say(msg, cls) {
    status.className = "status" + (cls ? " " + cls : "");
    status.innerHTML = msg;
  }

  // ---- the 12.41 MCP identity handshake -------------------------------
  // 1. password grant on the same origin (quick account, no registration)
  // 2. exchange code via /account/api/oauth/exchange (Bearer)
  // 3. redirect the in-game webview to {RedirectUrl}/exchange?exchangeCode=…&redirectUrl=…
  //    — the identity layer watches for the RedirectUrl prefix, intercepts,
  //    redeems the code (grant_type=exchange_code) and drops the webview.
  function urlenc(o) {
    var s = [];
    for (var k in o) s.push(encodeURIComponent(k) + "=" + encodeURIComponent(o[k]));
    return s.join("&");
  }
  function go(name, pass) {
    say('<span class="spin"></span>Signing in as ' + name + "…");
    fetch("/account/api/oauth/token", {
      method: "POST",
      headers: { "content-type": "application/x-www-form-urlencoded" },
      body: urlenc({ grant_type: "password", username: name, password: pass || "" })
    }).then(function (r) {
      if (!r.ok) throw new Error("token grant HTTP " + r.status);
      return r.json();
    }).then(function (tok) {
      say('<span class="spin"></span>Requesting an exchange code…');
      return fetch("/account/api/oauth/exchange", {
        headers: { authorization: "bearer " + tok.access_token }
      }).then(function (r) {
        if (!r.ok) throw new Error("exchange HTTP " + r.status);
        return r.json();
      });
    }).then(function (ex) {
      if (!ex || !ex.code) throw new Error("no exchange code in the response");
      // RedirectUrl base = this origin (the ini and the server port agree);
      // redirectUrl after the redeem sends the webview somewhere harmless.
      var back = encodeURIComponent(location.origin + "/login?done=1");
      var target = location.origin + "/exchange?exchangeCode=" + encodeURIComponent(ex.code) + "&redirectUrl=" + back;
      say("Handing back to Fortnite…", "ok");
      setTimeout(function () { location.replace(target); }, 250);
    }).catch(function (e) {
      say("Automatic sign-in failed (" + e.message + "). Use the form below.", "err");
      $("manual").style.display = "block";
      $("okcard").style.display = "none";
    });
  }

  // done=1 → the redeem succeeded; the game is closing the webview.
  if (location.search.indexOf("done=1") >= 0) {
    $("manual").style.display = "none";
    $("okcard").style.display = "block";
    say("Exchange complete.", "ok");
    setTimeout(function () { try { window.close(); } catch (x) {} }, 1200);
    return;
  }

  // Auto-run once the page settles; the manual form stays as a fallback.
  var name = "OwenPlayer";
  try {
    var m = /[#&?]name=([^&]+)/.exec(location.search);
    if (m) name = decodeURIComponent(m[1]);
  } catch (x) {}
  setTimeout(function () { go(name, ""); }, 400);

  $("go").addEventListener("click", function () {
    go($("name").value.trim() || "OwenPlayer", $("pass").value);
  });
})();
</script>
</body>
</html>
