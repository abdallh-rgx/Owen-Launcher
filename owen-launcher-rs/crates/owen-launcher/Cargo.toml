[package]
name = "owen-launcher"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Owen launcher core: Uptodown layer, install layer and the shared HTTP abstraction (the app/i18n/assets/backend layer is added on top)"

# Library only — the launcher application binary is wired by the app layer.

[dependencies]
owen-core = { path = "../owen-core" }
owen-patcher = { path = "../owen-patcher" }
serde = { workspace = true }
serde_json = { workspace = true }

# Native half: blocking reqwest (mirrors the HttpURLConnection calls of the
# Kotlin original). The workspace reqwest already carries json + rustls-tls.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { workspace = true, features = ["blocking"] }

# wasm half: ehttp (browser fetch). Callback-based, used by `fetch_async`.
[target.'cfg(target_arch = "wasm32")'.dependencies]
ehttp = { workspace = true }
