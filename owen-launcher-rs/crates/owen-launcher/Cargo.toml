[package]
name = "owen-launcher"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Owen Launcher core: the 1:1 safe-Rust port of the Owen-Launcher Android app (http, uptodown, install, core, i18n, backend layers)"

[dependencies]
owen-core = { path = "../owen-core" }
owen-patcher = { path = "../owen-patcher" }
owen-server = { path = "../owen-server" }
serde = { workspace = true }
serde_json = { workspace = true }
egui = "0.37"
axum = { workspace = true }
tokio = { workspace = true }

# Native half: blocking reqwest (mirrors the HttpURLConnection calls of the
# Kotlin original). The workspace reqwest already carries json + rustls-tls.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { workspace = true, features = ["blocking"] }

# wasm half: ehttp (browser fetch). Callback-based, used by `fetch_async`.
[target.'cfg(target_arch = "wasm32")'.dependencies]
ehttp = { workspace = true }
