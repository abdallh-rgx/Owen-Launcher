[workspace]
resolver = "2"
members = [
    "crates/owen-detect",
    "crates/owen-hook",
    "crates/owen-art",
    "crates/owen-redirecter",
    "crates/owen-server",
    "crates/owen-pak",
    "crates/owen-apk",
]

[workspace.package]
version = "2.0.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/abdallh-rgx/Owen-Launcher"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
