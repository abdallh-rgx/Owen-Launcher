# Portable toolchain config — works on CI and on any machine with the NDK
# under /opt/android-ndk or $ANDROID_NDK_HOME. The previous version carried
# sandbox-absolute paths (/home/z/ndk/...) which broke every CI build.

# NOTE: environment-style config ([env]) does not expand $ANDROID_NDK_HOME
# here on purpose — tools/build-apk.sh and the CI workflows export
# CC/CXX/AR themselves from whatever NDK they installed.

[target.aarch64-linux-android]
linker = "aarch64-linux-android24-clang"

[target.wasm32-unknown-unknown]
# (kept from the previous config)
